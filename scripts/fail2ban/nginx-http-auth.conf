# Fail2ban: ban IPs after repeated nginx auth failures (401).
# Install: sudo cp this file to /etc/fail2ban/jail.d/ then sudo systemctl reload fail2ban
[nginx-http-auth]
enabled = true
port = http,https
filter = nginx-http-auth
logpath = /var/log/nginx/error.log
maxretry = 5
findtime = 10m
bantime = 1h
