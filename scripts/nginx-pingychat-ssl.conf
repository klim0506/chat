# PingyChat: pingychat.com, www.pingychat.com, web.pingychat.com
# SSL certs: /etc/ssl/pingychat/
# Frontend root: /var/www/pingychat.com/frontend
# Backend: 127.0.0.1:8000
# Note: limit_req_zone and map are in conf.d/pingychat-limits.conf

# HTTP → HTTPS
server {
  listen 80;
  listen [::]:80;
  server_name pingychat.com www.pingychat.com web.pingychat.com;
  return 301 https://$host$request_uri;
}

# Marketing: pingychat.com + www (HTTPS) — SPA + proxy to backend (landing, wiki, app)
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name pingychat.com www.pingychat.com;

  ssl_certificate     /etc/ssl/pingychat/fullchain.pem;
  ssl_certificate_key /etc/ssl/pingychat/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
  ssl_prefer_server_ciphers off;

  client_max_body_size 4096M;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Strict-Transport-Security "max-age=31536000; preload" always;

  root /var/www/pingychat.com/frontend;
  index index.html;

  # SPA shell: не кешировать у CDN/браузере — иначе после деплоя подгружается старый index с прежними хешами чанков
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp|avif|mp4|webm)$ {
      expires 1y;
      add_header Cache-Control "public, immutable";
      access_log off;
    }
    location = /sw.js {
      expires off;
      add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
    location = /manifest.json {
      expires 1h;
      add_header Cache-Control "public, must-revalidate";
    }
  }

  location /api/ {
    limit_req zone=api_limit burst=50 nodelay;
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_connect_timeout 60s;
  }

  location /api/auth/send-code/ {
    limit_req zone=auth_limit burst=3 nodelay;
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /admin/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /media/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    expires 7d;
    add_header Cache-Control "public";
  }

  location /static/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location /ws/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
  }
}

