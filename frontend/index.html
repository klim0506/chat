<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#0b1220" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: blob: http: https:; media-src 'self' blob: http: https:; connect-src 'self' ws: wss: http: https:; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://www.gstatic.com; font-src 'self' https://fonts.gstatic.com data:;"
    />

    <title>Pingy — мессенджер без VPN и блокировок</title>
    <meta
      name="description"
      content="Pingy: стабильный мессенджер без VPN. Регистрация по SMS, файлы до 0,5 ГБ, до 300 участников. Личный чат — бесплатно."
    />
    <meta
      name="keywords"
      content="pingy, pingychat, pingychat.com, мессенджер без vpn, приватный чат, чат по sms, чаты россия"
    />

    <!-- canonical задаётся на сервере или в nginx -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Pingy — мессенджер без VPN и блокировок" />
    <meta
      property="og:description"
      content="Pingy: регистрация по SMS, файлы до 0,5 ГБ, до 300 участников. Личный чат — бесплатно."
    />
    <meta property="og:locale" content="ru_RU" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="/favicon.ico?v=2" />
    <link rel="icon" type="image/png" href="/icons/icon-96x96.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
