events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  upstream backend { server backend:8000; }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # ─── Rate-limiting zones ────────────────────────────────────────────
  limit_req_zone $binary_remote_addr zone=api_limit:10m   rate=30r/s;
  limit_req_zone $binary_remote_addr zone=auth_limit:10m  rate=5r/m;

  # ─── Gzip ───────────────────────────────────────────────────────────
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types text/plain text/css application/json application/javascript
             text/xml application/xml application/xml+rss text/javascript
             image/svg+xml;

  # ─── HTTP → HTTPS redirect ─────────────────────────────────────────
  server {
    listen 80;
    server_name ${DOMAIN};

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # ─── HTTPS server ──────────────────────────────────────────────────
  server {
    listen 443 ssl http2;
    server_name ${DOMAIN};

    # SSL certificates (Let's Encrypt)
    ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;

    # Mozilla Intermediate TLS configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    client_max_body_size 512M;

    # ─── Security headers ─────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Permissions-Policy        "camera=(), microphone=(self), geolocation=()" always;

    # ─── Frontend (static build) ──────────────────────────────────────
    root /var/www/frontend;
    index index.html;

    location / {
      try_files $uri $uri/ /index.html;

      # Cache static assets aggressively
      location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp|avif|mp4|webm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
      }

      # Service worker must not be cached
      location = /sw.js {
        expires off;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
      }

      # Manifest should be refreshed periodically
      location = /manifest.json {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
      }
    }

    # ─── API ──────────────────────────────────────────────────────────
    location /api/ {
      limit_req zone=api_limit burst=50 nodelay;

      proxy_pass http://backend;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # File uploads may take time
      proxy_read_timeout    300s;
      proxy_send_timeout    300s;
      proxy_connect_timeout 60s;
    }

    # Stricter rate limit for auth endpoints
    location /api/auth/send-code/ {
      limit_req zone=auth_limit burst=3 nodelay;

      proxy_pass http://backend;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── Admin ────────────────────────────────────────────────────────
    location /admin/ {
      proxy_pass http://backend;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── Static & media files from Django ─────────────────────────────
    location /media/ {
      proxy_pass http://backend;
      proxy_set_header Host $host;
      expires 7d;
      add_header Cache-Control "public";
    }

    location /static/ {
      proxy_pass http://backend;
      proxy_set_header Host $host;
      expires 1y;
      add_header Cache-Control "public, immutable";
    }

    # ─── WebSocket ────────────────────────────────────────────────────
    location /ws/ {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # Keep WebSocket alive
      proxy_read_timeout  86400s;
      proxy_send_timeout  86400s;
    }
  }
}
