# Security: headers and blocking of sensitive paths.
# Install: sudo cp this file to /etc/nginx/snippets/ and add in server { include /etc/nginx/snippets/pingychat-security.conf; }

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Do not serve .env, .git, config and source files
location ~ /\. {
    return 404;
}
location ~* \.(env|sql|py|key|pem)(/|$)|\.env$ {
    return 404;
}
