# Rate limits and connection limit (DDoS / abuse mitigation). Include in http context (e.g. conf.d).
# Admin: strict (brute-force protection)
limit_req_zone $binary_remote_addr zone=admin_limit:10m rate=5r/m;
# API: per-IP request rate (flood protection)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
# Concurrent connections per IP (exhaustion protection)
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
