# Сборка Tauri: desktop (Linux, Windows, macOS) и mobile iOS.
# Артефакты: Actions → Run → Artifacts.
# Запуск: push в release / тег v* / ручной Run workflow.

name: Tauri build (Desktop + iOS)

on:
  push:
    branches: [release]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            runner: ubuntu-22.04
            target: ''
          - platform: windows-latest
            runner: windows-latest
            target: ''
          - platform: macos-latest
            runner: macos-latest
            target: ''
          - platform: macos-intel
            runner: macos-latest
            target: x86_64-apple-darwin

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Linux dependencies (Ubuntu)
        if: matrix.runner == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Build Tauri
        working-directory: frontend
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            npx tauri build --target ${{ matrix.target }}
          else
            npm run desktop:build
          fi
        env:
          CI: false

      - name: Upload Linux artifacts
        if: matrix.runner == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: |
            frontend/src-tauri/target/release/bundle/deb/*.deb
            frontend/src-tauri/target/release/bundle/appimage/*.AppImage
            frontend/src-tauri/target/release/bundle/rpm/*.rpm

      - name: Copy NSIS installer as Pingy-setup.exe (for site)
        if: matrix.runner == 'windows-latest'
        working-directory: frontend
        run: |
          $nsis = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          if ($nsis) { Copy-Item $nsis.FullName -Destination Pingy-setup.exe }
        shell: pwsh

      - name: Upload Windows artifacts
        if: matrix.runner == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: |
            frontend/src-tauri/target/release/bundle/msi/*.msi
            frontend/src-tauri/target/release/bundle/nsis/*.exe
            frontend/Pingy-setup.exe
        if-no-files-found: ignore

      - name: Upload macOS artifacts (ARM)
        if: matrix.runner == 'macos-latest' && matrix.target == ''
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-arm64
          path: |
            frontend/src-tauri/target/release/bundle/dmg/*.dmg
            frontend/src-tauri/target/release/bundle/macos/*.app

      - name: Upload macOS artifacts (Intel)
        if: matrix.runner == 'macos-latest' && matrix.target == 'x86_64-apple-darwin'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-x64
          path: |
            frontend/src-tauri/target/release/bundle/dmg/*.dmg
            frontend/src-tauri/target/release/bundle/macos/*.app

  # ——— iOS (только на macOS, нужен Xcode) ———
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          CI: false

      - name: Init Tauri iOS (если ещё не создан проект)
        working-directory: frontend
        run: npx tauri ios init || true
        env:
          CI: false

      - name: Build Tauri iOS
        working-directory: frontend
        run: npx tauri ios build -- --export-method development
        env:
          CI: false
        continue-on-error: true

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mobile-ios
          path: |
            frontend/src-tauri/gen/apple/build/**/*.ipa
            frontend/src-tauri/gen/apple/build/**/*.app
        if-no-files-found: ignore
