apply plugin: 'com.android.application'

android {
    namespace 'com.pingychat.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.pingychat.app"
        minSdk 21
        targetSdk 34
        // Синхронизируйте с frontend/package.json и frontend/src-tauri/tauri.conf.json (version)
        versionCode 10320
        versionName "1.3.20"
    }

    // Release APK для прямой раздачи (сайт). Для Google Play замените на свой keystore.
    signingConfigs {
        release {
            storeFile file("${System.getProperty('user.home')}/.android/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.8.0'
}
